kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Level SDK bersama. Ditulis sekali di sini supaya tidak melenceng antar module.
# minSdk 23, bukan 21: EncryptedSharedPreferences dan pembuatan key
# non-extractable di Android Keystore sama-sama mensyaratkannya.
cashup.compileSdk=33
cashup.minSdk=23
cashup.targetSdk=33

# Sumber SDK CashUp untuk :app.
#   local = module project di repo ini (default)
#   maven = artifact dari Maven privat CashUp (lihat settings.gradle.kts)
# URL, username dan token Maven TIDAK ditulis di sini: taruh CASHUP_MAVEN_URL,
# CASHUP_MAVEN_USERNAME, CASHUP_MAVEN_TOKEN di ~/.gradle/gradle.properties
# atau environment variable. Override sekali jalan: -Pcashup.sdk.source=maven
cashup.sdk.source=maven
cashup.sdk.version=0.1.0
cashup.sdk.emvlibVersion=1.0.2
