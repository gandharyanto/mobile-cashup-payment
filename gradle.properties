kotlin.code.style=official
org.gradle.jvmargs=-Xmx2g
org.gradle.parallel=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Level SDK bersama. Ditulis sekali di sini supaya tidak melenceng antar module.
# minSdk 23, bukan 21: EncryptedSharedPreferences dan pembuatan key
# non-extractable di Android Keystore sama-sama mensyaratkannya.
cashup.compileSdk=33
cashup.minSdk=23
cashup.targetSdk=33

# Versi SDK CashUp dari Maven privat untuk :app (lihat settings.gradle.kts).
# URL, username dan token Maven TIDAK ditulis di sini: taruh CASHUP_MAVEN_URL,
# CASHUP_MAVEN_USERNAME, CASHUP_MAVEN_TOKEN di ~/.gradle/gradle.properties
# atau environment variable.
cashup.sdk.version=0.1.4
cashup.sdk.emvlibVersion=1.0.2

# Per-module SDK versions (override cashup.sdk.version for one artifact)
cashup.sdk.version.qris-core=0.1.7
cashup.sdk.version.feature-qris=0.1.8
cashup.sdk.version.device-sdk=0.1.8
cashup.sdk.version.device-sdk-edc=0.1.8
cashup.sdk.version.cdcp-core=0.1.7
cashup.sdk.version.feature-card-payment=0.1.8
